name = "cryotech-webhook-buffer"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# La cola sigue moviéndose por Meta empujando y la API tirando, no por el
# horario. Estos disparos hacen otras dos cosas:
#
#   0 4 * * *      limpieza de filas ya confirmadas
#   */10 * * * *   mantener la API despierta
#
# Los crons de la API viven dentro de su proceso (@nestjs/schedule): la tasa del
# BCV, el resumen diario de las 7 pm, el semanal del lunes y la limpieza de
# borradores. En el plan gratuito de Render la instancia duerme a los quince
# minutos sin tráfico, y dormida no hay proceso que los ejecute. Antes solo se
# la despertaba minutos antes de cada refresco de tasa; con los resúmenes eso ya
# no alcanza, y un mensaje de Telegram a una instancia dormida espera medio
# minuto de arranque en frío. Un ping cada diez minutos la mantiene viva 24/7,
# y una sola instancia entra en las 750 horas gratuitas del mes.
# Las horas van en UTC; Caracas es UTC-4.
[triggers]
crons = ["0 4 * * *", "*/10 * * * *"]

[vars]
# La API corre en una instancia gratuita de Render, que se duerme a los quince
# minutos sin tráfico entrante. Su propio poller sale hacia afuera, así que
# nunca puede despertarse sola: este Worker le pega un ping al recibir un
# mensaje. No es un secreto — es una URL pública protegida por lo que hay
# detrás — así que vive aquí y no en `wrangler secret`.
#
# Se completa al desplegar con la URL de TU API en Render (la que asigne a
# `cryotech-api`), terminada en /api/health. Vacía, el Worker no despierta nada.
API_WAKE_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "cryotech-webhook-buffer"
# Se completa con el id que imprime `pnpm db:create` en tu cuenta de Cloudflare.
# El que había aquí era la base del dueño anterior del proyecto.
database_id = ""

# Secrets are set with `wrangler secret put`, never committed:
#   META_APP_SECRET             (from the Meta app: Settings > Basic > App Secret)
#   META_WHATSAPP_VERIFY_TOKEN  (any string; the same one entered in Meta)
#   PULL_TOKEN                  (any long random string; shared with the API)
