server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx advertises its exact version by default, which is free reconnaissance.
    server_tokens off;

    # --- Security headers -------------------------------------------------
    #
    # The app keeps its session in localStorage, so an XSS is not a defacement,
    # it is a stolen session that survives every reload. The CSP is the control
    # that makes that hard, and `always` matters: without it these are dropped
    # on error responses, which is exactly where an injected page would land.
    #
    # Google Fonts is allowlisted explicitly rather than left to a wildcard.
    # Self-hosting the two families would let us drop these two origins
    # entirely — worth doing, but it is an asset migration, not a header change.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # 'unsafe-inline' above covers style only: Radix positions floating elements
    # with inline styles, so removing it breaks every dropdown and dialog.
    # Scripts have no such exemption, which is what the policy is really for.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Redundant with frame-ancestors for modern browsers, kept for older ones.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location replaces the inherited set, so the
        # headers above have to be repeated for assets to keep them.
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
